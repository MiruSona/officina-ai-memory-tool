# 검색 골든셋 v2 — 80건 (v0.1 42건 + 파도 F 가 새로 쓴 38건)
#
# 바탕 : AIMemoryTool/v0.1/testdata/golden/goldenset.yaml (42건 = 손 30 + 보강 12)
# 규격 : 2026-08-23-v0.2-품질규칙표.md 4-1 절 · 설계서 4-9 절
# 저장소 : Memory/store/ 의 실제 기억. 새로 쓴 38건은 정답 문서를 먼저 열어 보고 질문을 썼다.
#
# ── 건수와 분포 ─────────────────────────────────────────────────────
#
#  유형          v0.1   더함   합계   최소(checkShape)
#  extract        20     12     32     8
#  multisession    5     11     16     5
#  temporal        5      7     12     5
#  update          5      5     10     5
#  abstain         7      3     10     7
#  합계           42     38     80
#
#  언어         v0.1   더함   합계   최소
#  ko            36     30     66     —
#  en             6      8     14     12
#
#  변이(variant)          건수
#  literal                 36    낱말을 문서에서 그대로 가져온 질의 (v0.1 42건은 대부분 여기)
#  paraphrase              32    사람이 물어볼 법한 말로 바꿔 쓴 것
#  longform                12    한 문장이 아니라 상황까지 설명하는 긴 질의
#
#  hard: true    38건    사람이 "이건 지금 못 맞힌다" 고 보고 붙인 것
#  unreachable   3건     정답 문서에 질의 낱말이 0회 — 합격선 계산에서 뺀다
#
# ── 늘린 규칙 (설계 4-9) ────────────────────────────────────────────
#  1. 근거 문서를 먼저 고르고 질문을 썼다. 문항부터 쓰면 unreachable 이 생긴다.
#  2. 새 문서마다 literal · paraphrase · longform 세 변이를 짝으로 넣었다.
#  3. lang: en 을 6 → 14 로 올렸다 (최소 12).
#  4. multisession 은 expect 2건 이상 + expect_mode: all — 하나만 맞혀서는 정답이 아니다.
#  5. 표기 변이를 일부러 넣었다 (기억저장소/기억 저장소 · 5,000/5000 · trigram/색인).
#
# ── 칸 ──────────────────────────────────────────────────────────────
#  q            질의
#  kind         extract | multisession | temporal | update | abstain
#  lang         ko | en
#  variant      literal | paraphrase | longform      ← v0.2 신설
#  expect       정답 id 목록 (abstain 은 빈 목록)
#  not_expect   나오면 안 되는 id
#  expect_mode  any | all   ← v0.2 신설. multisession 은 반드시 all
#  unreachable  낱말 검색으로 원리상 못 맞히는 질의. 합격선에서 뺀다
#  hard         지금 못 맞힌다고 보고 넣은 질의
version: 3
cases:
  # ══════════════════════════════════════════════════════════════════
  # v0.1 에서 그대로 가져온 42건 (variant · expect_mode 를 새로 붙였다)
  # ══════════════════════════════════════════════════════════════════

