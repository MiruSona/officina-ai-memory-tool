# 품질 골든셋 — `mem eval --quality` 가 읽는 자
#
# 무엇 : 실제 기억 206건을 손으로 읽어 매긴 품질 판정표. 규칙 61개가 이것을 잡는지(재현율),
#        멀쩡한 것을 안 잡는지(거짓 경보) 를 잰다.
# 원천 : AIMemoryTool/v0.2/Docs/Research/2026-08-23-조사D-실기억품질표.md (2절 114행 · 4절 대조군 20건)
#        본문 근거는 같은 폴더의 2026-08-23-조사D-내부자료전수.md
# 규격 : 2026-08-23-v0.2-품질규칙표.md 4-2 절 (`id` / `defects` / `note`) 에
#        파도 F 가 `rules` · `expect` 두 칸을 더했다. 이유는 아래 "칸 설명" 에 있다.
# 대상 저장소 : ./testdata/quality/store/  (판정에 쓴 132건만 복사해 둔 것)
#
# ── 건수 ────────────────────────────────────────────────────────────
#   잡을 것(expect: flag)   112 건   ← 조사 D 2절 114행에서 12ba022f·adad8ce3 이 두 줄씩이라 합쳐 112
#   대조군(expect: clean)    20 건   ← 조사 D 4절
#   합계                    132 건   (da73dcbe·676d1c01 은 양쪽에 다 있어 고유 id 는 130)
#
# ── 유형별 (겹침 포함, 잡을 것 112건 기준) ──────────────────────────
#   DUP 36 · STALE 25 · MULTI 25 · SRC 15 · TAG 13 · SCOPE 11 · NOVALUE 10 ·
#   CONFLICT 10 · FORMAT 9 · THIN 6 · SUMMARY 2 · TYPE 1 · NOTATION 1
#
# ── 조사 D 표에서 고친 것 (원본 파일을 열어 확인한 결과) ─────────────
#   1. 1282336a 의 DUP 를 뺐다. 「툴킷·저장소 분리」 결정 셋(1fae6641·3727333b·ea6ac046)과
#      같다고 적혀 있으나 원본은 dogfooding("만들면서부터 여기서 쓴다") 결정이다. SRC 만 남긴다.
#   2. 공수 실적 history 6건(2736a576·d65e1ca2·8d9c0d21·a09313a5·eda97926·96998241)의 DUP 를 뺐다.
#      여섯이 서로 다른 작업 회차의 실측이라 같은 사실이 아니다. NOVALUE 만 남긴다.
#   3. 07ce6094·47bf15db 에 SRC 를 더했다. 본문 근거가 "옛 설계 …(git 이력에만 있다)" 뿐인 것을
#      원본에서 확인했다. 저장소 206건 중 이 꼴은 정확히 15건이고 전부 이 골든셋 안에 있다.
#   4. 대조군 43a62aa5 에 `allow_rules: [unfixed-marker]` 를 달았다. 본문 끝에 「안 고침」 이 있어
#      B10 이 반드시 켜진다. 형식·내용은 모범이라 대조군에 남기고 그 규칙만 눈감는다.
#   그 밖 128건은 표의 판정을 그대로 뒀다 — 아래 "확인한 방법" 참고.
#
# ── 칸 설명 ─────────────────────────────────────────────────────────
#   id          기억 id. 원본은 testdata/quality/store/ 에 있다
#   defects     기대 유형 코드. 조사 D 1절의 14개 코드를 그대로 쓴다
#               DUP CONFLICT STALE MULTI THIN SUMMARY TAG SRC SCOPE TYPE NOVALUE FORMAT NOTATION OK
#   rules       그 유형을 잡아야 할 규칙 이름(품질규칙표 1절 42개). **여럿 중 하나만 켜져도 잡은 것으로 센다**
#               (`rules_match: any`). 유형 하나가 규칙 여럿에 걸쳐 있어서다
#               (v0.3 물결2 2D) 새 규칙 셋을 그 유형 줄에 더했다 — STALE 에 `stale-age`·`stale-conflict-pair`,
#               NOVALUE 에 `no-value`. **사람이 매긴 판정(defects·expect·note)은 한 글자도 안 고쳤다.**
#   expect      flag = 잡아야 한다 / clean = 잡으면 거짓 경보다
#   note        한 줄 이유 (조사 D 표 원문. 기억 본문은 여기 안 옮긴다)
#   correction  파도 F 가 표의 판정을 고친 자리와 그 이유
#   human_only  코드가 못 가리고 사람이 판정하는 유형 (재현율 셈에서 뺀다)
#   allow_rules 대조군인데 이 규칙만은 켜져도 거짓 경보로 안 세는 것
#
# ── 채점 규칙 (설계서 3-6 절) ───────────────────────────────────────
#   재현율    expect: flag 112건 중 몇 건을 잡았나. 유형별로 따로 센다
#   거짓 경보 expect: clean 20건 중 몇 건을 잡았나. **0 이 목표**
#   ※ 정밀도는 대조군에 대고 잰다. 이 표는 유형별로 전수가 아니므로
#     flag 쪽에서 표에 없는 규칙이 켜진 것을 오탐으로 세면 안 된다.
#
# ── 이전 전 저장소라는 것 (중요) ────────────────────────────────────
#   여기 132건은 전부 v0.1 규격으로 쓰인 것이라 v0.2 필수 칸이 통째로 없다
#   (title 0/206 · author 없음 · sources 없음 · 출처 태그 `impl`·`poc`·`fieldtest` 그대로).
#   그래서 아래 규칙은 132건 전부에 켜진다. **대조군 거짓 경보 셈에서 뺀다** — 이전 전 저장소의
#   규격 미달은 「멀쩡한 기억을 잘못 잡은 것」 이 아니다. `mem migrate` 가 맡을 자리다.
#   (잡을 것 쪽은 `rules` 에 적힌 규칙만 세므로 이 잡음에 안 흔들린다)
meta:
  version: 1
  rules_match: any
  pre_migration: true
  exclude_rules_on_clean:
    - required-field      # F02 — title·author·sources 가 없다 (206/206)
    - title-shape         # F06
    - title-not-generic   # F07
    - author-shape        # F19
    - sources-required    # F16
    - sources-shape       # F17
    - tag-not-source      # F10 — 대조군에도 fieldtest·poc·survey 가 붙어 있다
    - link-missing        # D04 — 실기억 206건에 links 가 2건뿐이라 대조군도 전부 비어 있다
  store: ./testdata/quality/store

