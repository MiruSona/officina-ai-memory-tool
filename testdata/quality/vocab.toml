# 품질 골든셋(130건)이 쓰는 낱말 표준이다. 이 자료는 이 도구를 만든 저장소의
# 기억을 그대로 떠 온 것이라, 그 저장소의 태그·scope 를 여기 같이 둔다.
#
# 도구가 깔아 주는 씨앗 목록(config.DefaultVocab)에는 이 낱말을 넣지 않는다 —
# 새 프로젝트가 첫 mem add 부터 다 거절당하기 때문이다 (외부 말뭉치 시험 C5).

